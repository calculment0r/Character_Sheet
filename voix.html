<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CHARACTER FACTORY · VOIX</title>
<meta name="description" content="Page de test de l'étage Voix : audition, verrouillage, répliques jouées, conversation avec le personnage.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23e0674a'/%3E%3Crect x='12' y='12' width='8' height='8' rx='2' fill='%23170c08'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Azeret+Mono:wght@300;400;500&family=Saira+Semi+Condensed:wght@400;600&display=swap">
<link rel="stylesheet" href="./assets/tokens.css">
<link rel="stylesheet" href="./assets/rack.css">
<link rel="stylesheet" href="./assets/factory.css">
<link rel="stylesheet" href="./assets/studio.css">
<style>
  /* Page de test, volontairement sobre : l'écran définitif viendra avec le studio. Jetons seuls. */
  .vx { max-width: 1100px; margin: 0 auto; padding: var(--s6) var(--s6) 72px; display: flex; flex-direction: column; gap: var(--s5); }
  @media (max-width: 640px) { .vx { padding: var(--s4) 16px 60px; } }
  .vx section { background: var(--panel); border-radius: var(--r4); box-shadow: inset 0 0 0 1px var(--line); padding: var(--s5); display: flex; flex-direction: column; gap: var(--s3); }
  .vx h2 { margin: 0; font-family: var(--f-disp); font-weight: 400; font-size: 15px; letter-spacing: .06em; text-transform: uppercase; }
  .vx .row { display: flex; gap: var(--s2); flex-wrap: wrap; align-items: center; }
  .vx .row .fld { flex: 1; min-width: 160px; }
  .vx .note { color: var(--ink2); font-size: 12px; line-height: 1.6; margin: 0; }
  .vx .warn { color: var(--or); }
  .vx .meta { font-family: var(--f-mono); font-size: 9px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink3); }
  .vx .item { display: flex; gap: var(--s3); align-items: center; flex-wrap: wrap; padding: var(--s2) var(--s3); border-radius: var(--r2); box-shadow: inset 0 0 0 1px var(--line); }
  .vx .item.on { box-shadow: inset 0 0 0 1px var(--line-gr); }
  .vx audio { height: 32px; max-width: 100%; }
  .vx .log { max-height: 340px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; font-size: 13px; line-height: 1.55; }
  .vx .log .u { color: var(--cy); }
  .vx .log .a { color: var(--ink); }
  .vx .log .s { color: var(--ink3); font-family: var(--f-mono); font-size: 10px; }
  .vx .live { color: var(--ink3); font-style: italic; min-height: 18px; font-size: 13px; }
</style>
</head>
<body>
<header class="hdr">
  <a class="logo" href="./studio.html" title="le studio">
    <span class="sq"><i></i></span>
    <span><b>Character Factory</b><small>voix · page de test</small></span>
  </a>
  <span class="sp"></span>
  <span class="pill" id="pill"><i></i><span id="pill-text">démarrage</span></span>
</header>

<main class="vx">
  <section>
    <div class="row">
      <select class="fld" id="perso" aria-label="personnage"></select>
      <button class="tb ghost sm" id="reload">Relire</button>
    </div>
    <p class="note" id="perso-info"></p>
  </section>

  <section>
    <h2>Audition</h2>
    <textarea class="fld" id="desc" rows="3" placeholder="La voix décrite (anglais conseillé). Vide : le modèle l'écrit depuis la fiche."></textarea>
    <div class="row">
      <button class="tb go" id="design">Auditionner 4 voix</button>
      <button class="tb ghost sm" id="redraft">Réécrire depuis la fiche</button>
      <span class="meta" id="design-job"></span>
    </div>
    <div id="cands" class="log"></div>
  </section>

  <section>
    <h2>Jeu</h2>
    <textarea class="fld" id="line-text" rows="2" placeholder="La réplique, en français."></textarea>
    <div class="row">
      <input class="fld" id="line-dir" placeholder="Direction (facultative) : sinon le modèle écrit l'état de jeu">
      <input class="fld" id="line-ctx" placeholder="Situation (facultative)">
      <button class="tb ghost sm" id="line-go">Jouer 3 prises</button>
      <span class="meta" id="line-job"></span>
    </div>
    <div id="lines" class="log"></div>
  </section>

  <section>
    <h2>Conversation</h2>
    <p class="note" id="mic-note"></p>
    <div class="row">
      <button class="tb ghost sm" id="connect">Se connecter</button>
      <button class="tb ghost sm" id="mic" disabled>Micro</button>
      <select class="fld" id="cran" aria-label="patience de l'oreille" style="flex:0 0 150px">
        <option value="vif">vif</option><option value="normal" selected>normal</option><option value="patient">patient</option>
      </select>
      <button class="tb ghost sm" id="hush">Silence</button>
    </div>
    <div class="row">
      <input class="fld" id="say" placeholder="Écrire au personnage, Entrée pour envoyer">
      <button class="tb ghost sm" id="send">Envoyer</button>
    </div>
    <div class="live" id="live"></div>
    <div class="log" id="chat"></div>
    <p class="meta" id="metrics"></p>
  </section>
</main>
<script type="module" src="./js/voix.js"></script>
</body>
</html>
