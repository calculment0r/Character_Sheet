<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CHARACTER FACTORY · STUDIO</title>
<meta name="description" content="Le studio : le casting en affiches, et chaque personnage — son identité, son visage, sa garde-robe, sa voix, sa planche — jusqu'à lui parler.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23e0674a'/%3E%3Crect x='12' y='12' width='8' height='8' rx='2' fill='%23170c08'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Azeret+Mono:wght@300;400;500&family=Saira+Semi+Condensed:wght@400;600&display=swap">
<link rel="stylesheet" href="./assets/tokens.css">
<link rel="stylesheet" href="./assets/rack.css">
<link rel="stylesheet" href="./assets/factory.css">
<link rel="stylesheet" href="./assets/studio.css">
</head>
<body>

<header class="hdr">
  <a class="logo" href="#/" title="le casting">
    <span class="sq"><i></i></span>
    <span>
      <b>Character Factory</b>
      <small>studio</small>
    </span>
  </a>
  <span class="sp"></span>
  <div class="mach" id="machines">
    <button class="mach-btn" id="machines-btn" type="button" aria-expanded="false" aria-controls="machines-pop"
      title="les machines : allumées, prêtes, ce qu'il faut démarrer"><i></i><span id="machines-text">machines</span></button>
    <div class="mach-pop" id="machines-pop" role="dialog" aria-label="les machines" hidden></div>
  </div>
  <span class="pill" id="sys-pill"><i></i><span id="sys-text">démarrage</span></span>
  <a class="tb ghost sm" id="queue-link" href="./coulisses.html#/file" title="la file des rendus : arrêter, relancer">File</a>
  <a class="tb ghost sm" id="coulisses-link" href="./coulisses.html" title="les coulisses : tout ce que la chaîne fabrique, pour vérifier">Coulisses</a>
</header>

<main class="studio" id="app"></main>

<div class="scrim lightbox" id="lightbox" hidden>
  <div>
    <img id="lightbox-img" alt="">
    <div class="cap" id="lightbox-cap"></div>
  </div>
</div>

<div class="scrim" id="confirm" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
    <div class="modal-head"><span class="t" id="confirm-title">confirmer</span></div>
    <div class="modal-body"><p id="confirm-text"></p></div>
    <div class="modal-foot"><span class="sp"></span>
      <button class="tb ghost" id="confirm-no">Pas encore</button>
      <button class="tb go" id="confirm-yes">Oui</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module" src="./js/studio.js"></script>
</body>
</html>
